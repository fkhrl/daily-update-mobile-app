name: Build Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate platform files
        run: flutter create .

      - name: Configure Android native platform (Internet & Firebase)
        run: |
          python3 -c "
          import os, shutil
          # Add Internet permission
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              if 'android.permission.INTERNET' not in content:
                  content = content.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application')
                  with open(manifest_path, 'w') as f:
                      f.write(content)
                  print('Added INTERNET permission.')
          
          # Add Firebase plugin if google-services.json is present
          if os.path.exists('google-services.json'):
              shutil.copy('google-services.json', 'android/app/google-services.json')
              print('Copied google-services.json.')
              
              # settings.gradle
              settings_path = 'android/settings.gradle'
              if os.path.exists(settings_path):
                  with open(settings_path, 'r') as f:
                      content = f.read()
                  if 'google-services' not in content:
                      content = content.replace('plugins {', 'plugins {\n    id \"com.google.gms.google-services\" version \"4.4.1\" apply false')
                      with open(settings_path, 'w') as f:
                          f.write(content)
                      print('Added google-services to settings.gradle.')
                      
              # app/build.gradle
              app_gradle_path = 'android/app/build.gradle'
              if os.path.exists(app_gradle_path):
                  with open(app_gradle_path, 'r') as f:
                      content = f.read()
                  if 'google-services' not in content:
                      content = content.replace('plugins {', 'plugins {\n    id \"com.google.gms.google-services\"')
                      with open(app_gradle_path, 'w') as f:
                          f.write(content)
                      print('Applied google-services plugin in app/build.gradle.')
          else:
              print('google-services.json not found in root, skipping Firebase native config.')
          "

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
