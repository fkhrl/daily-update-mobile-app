name: Build Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate platform files
        run: flutter create .

      - name: Configure Gradle wrapper distribution URL
        run: |
          wrapper_properties="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$wrapper_properties" ]; then
            sed -i 's|github.com/gradle/gradle-distributions/releases/download|services.gradle.org/distributions|g' "$wrapper_properties"
            echo "Updated distributionUrl in gradle-wrapper.properties to official services.gradle.org"
          fi

      - name: Configure Android native platform (Internet & Firebase)
        run: |
          python3 -c "
          import os, shutil
          # Add Internet permission
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              if 'android.permission.INTERNET' not in content:
                  content = content.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application')
                  with open(manifest_path, 'w') as f:
                      f.write(content)
                  print('Added INTERNET permission.')
          
          # Add Firebase plugin if google-services.json is present
          google_json = 'app/google-services.json'
          if os.path.exists(google_json):
              shutil.copy(google_json, 'android/app/google-services.json')
              print('Copied google-services.json.')
              
              # 1. settings.gradle (modern declarative style)
              settings_path = 'android/settings.gradle'
              if os.path.exists(settings_path):
                  with open(settings_path, 'r') as f:
                      content = f.read()
                  if 'google-services' not in content and 'plugins {' in content:
                      content = content.replace('plugins {', 'plugins {\n    id \"com.google.gms.google-services\" version \"4.4.1\" apply false')
                      with open(settings_path, 'w') as f:
                          f.write(content)
                      print('Added google-services to settings.gradle.')
                      
              # 2. build.gradle (traditional buildscript classpath style)
              build_gradle_path = 'android/build.gradle'
              if os.path.exists(build_gradle_path):
                  with open(build_gradle_path, 'r') as f:
                      content = f.read()
                  if 'google-services' not in content and 'dependencies {' in content:
                      content = content.replace('dependencies {', 'dependencies {\n        classpath \"com.google.gms:google-services:4.4.1\"')
                      with open(build_gradle_path, 'w') as f:
                          f.write(content)
                      print('Added google-services classpath to build.gradle.')
                      
              # 3. app/build.gradle (apply plugin)
              app_gradle_path = 'android/app/build.gradle'
              if os.path.exists(app_gradle_path):
                  with open(app_gradle_path, 'r') as f:
                      content = f.read()
                  if 'google-services' not in content:
                      if 'plugins {' in content:
                          content = content.replace('plugins {', 'plugins {\n    id \"com.google.gms.google-services\"')
                          print('Applied google-services plugin in plugins block.')
                      else:
                          content += '\napply plugin: \"com.google.gms.google-services\"\n'
                          print('Appended apply plugin: com.google.gms.google-services at end.')
                      with open(app_gradle_path, 'w') as f:
                          f.write(content)
          else:
              print('google-services.json not found in app/ directory, skipping Firebase native config.')
              
          # Force compileSdk to 35 for sensors_plus / androidx compatibility
          import re
          app_gradle_path = 'android/app/build.gradle'
          if os.path.exists(app_gradle_path):
              with open(app_gradle_path, 'r') as f:
                  content = f.read()
              # Match all variants: compileSdk 33, compileSdk = 33,
              # compileSdk flutter.compileSdkVersion, compileSdk = flutter.compileSdkVersion
              content = re.sub(
                  r'compileSdkVersion\s*=?\s*(flutter\.compileSdkVersion|\d+)',
                  'compileSdkVersion 35',
                  content
              )
              content = re.sub(
                  r'compileSdk\s*=?\s*(flutter\.compileSdkVersion|\d+)',
                  'compileSdk 35',
                  content
              )
              # Also ensure targetSdk is at least 35
              content = re.sub(
                  r'targetSdkVersion\s*=?\s*(flutter\.targetSdkVersion|\d+)',
                  'targetSdkVersion 35',
                  content
              )
              content = re.sub(
                  r'targetSdk\s*=?\s*(flutter\.targetSdkVersion|\d+)',
                  'targetSdk 35',
                  content
              )
              with open(app_gradle_path, 'w') as f:
                  f.write(content)
              print('Forced compileSdk and targetSdk to 35.')
              print('Updated app/build.gradle content:')
              print(content)
          "


      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
