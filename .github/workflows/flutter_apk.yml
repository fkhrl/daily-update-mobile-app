name: Build Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate platform files
        run: flutter create .

      - name: Configure Gradle wrapper distribution URL
        run: |
          wrapper_properties="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$wrapper_properties" ]; then
            sed -i 's|github.com/gradle/gradle-distributions/releases/download|services.gradle.org/distributions|g' "$wrapper_properties"
            echo "Updated distributionUrl in gradle-wrapper.properties to official services.gradle.org"
          fi

      - name: Write Android config script
        run: |
          cat > /tmp/configure_android.py << 'PYEOF'
          import os, re, shutil

          # ── Internet permission ────────────────────────────────────────
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  content = f.read()
              if 'android.permission.INTERNET' not in content:
                  content = content.replace(
                      '<application',
                      '<uses-permission android:name="android.permission.INTERNET"/>\n    <application'
                  )
                  with open(manifest_path, 'w') as f:
                      f.write(content)
                  print('Added INTERNET permission.')

          # ── Firebase (only if google-services.json is present) ─────────
          google_json = 'app/google-services.json'
          if os.path.exists(google_json):
              shutil.copy(google_json, 'android/app/google-services.json')
              print('Copied google-services.json.')

              # settings.gradle (Groovy)
              settings_path = 'android/settings.gradle'
              if os.path.exists(settings_path):
                  with open(settings_path, 'r') as f:
                      content = f.read()
                  if 'google-services' not in content and 'plugins {' in content:
                      content = content.replace(
                          'plugins {',
                          'plugins {\n    id "com.google.gms.google-services" version "4.4.1" apply false'
                      )
                      with open(settings_path, 'w') as f:
                          f.write(content)
                      print('Added google-services to settings.gradle.')

              # settings.gradle.kts (Kotlin)
              settings_kts_path = 'android/settings.gradle.kts'
              if os.path.exists(settings_kts_path):
                  with open(settings_kts_path, 'r') as f:
                      content = f.read()
                  if 'google-services' not in content and 'plugins {' in content:
                      content = content.replace(
                          'plugins {',
                          'plugins {\n    id("com.google.gms.google-services") version "4.4.1" apply false'
                      )
                      with open(settings_kts_path, 'w') as f:
                          f.write(content)
                      print('Added google-services to settings.gradle.kts.')

              # build.gradle (Groovy)
              build_gradle_path = 'android/build.gradle'
              if os.path.exists(build_gradle_path):
                  with open(build_gradle_path, 'r') as f:
                      content = f.read()
                  if 'google-services' not in content and 'dependencies {' in content:
                      content = content.replace(
                          'dependencies {',
                          'dependencies {\n        classpath "com.google.gms:google-services:4.4.1"'
                      )
                      with open(build_gradle_path, 'w') as f:
                          f.write(content)
                      print('Added google-services classpath to build.gradle.')

              # app/build.gradle (Groovy)
              app_gradle_path = 'android/app/build.gradle'
              if os.path.exists(app_gradle_path):
                  with open(app_gradle_path, 'r') as f:
                      content = f.read()
                  if 'google-services' not in content:
                      if 'plugins {' in content:
                          content = content.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services"')
                          print('Applied google-services plugin in plugins block.')
                      else:
                          content += '\napply plugin: "com.google.gms.google-services"\n'
                          print('Appended apply plugin at end.')
                      with open(app_gradle_path, 'w') as f:
                          f.write(content)

              # app/build.gradle.kts (Kotlin)
              app_gradle_kts_path = 'android/app/build.gradle.kts'
              if os.path.exists(app_gradle_kts_path):
                  with open(app_gradle_kts_path, 'r') as f:
                      content = f.read()
                  if 'google-services' not in content and 'plugins {' in content:
                      content = content.replace(
                          'plugins {',
                          'plugins {\n    id("com.google.gms.google-services")'
                      )
                      with open(app_gradle_kts_path, 'w') as f:
                          f.write(content)
                      print('Applied google-services plugin in plugins block in app/build.gradle.kts.')
          else:
              print('google-services.json not found — skipping Firebase config.')

          # ── Force compileSdk 35 on ALL subprojects (sensors_plus fix) ──
          # Inject a subprojects block into android/build.gradle so that
          # Flutter plugins like sensors_plus also compile with SDK 35.
          subprojects_snippet = (
              '\n// AUTO: Force all plugins to compileSdk 35\n'
              'subprojects {\n'
              '    afterEvaluate { proj ->\n'
              '        if (proj.hasProperty("android")) {\n'
              '            proj.android.compileSdkVersion 35\n'
              '        }\n'
              '    }\n'
              '}\n'
          )
          root_gradle = 'android/build.gradle'
          if os.path.exists(root_gradle):
              with open(root_gradle, 'r') as f:
                  content = f.read()
              if 'compileSdkVersion 35' not in content:
                  content += subprojects_snippet
                  with open(root_gradle, 'w') as f:
                      f.write(content)
                  print('Injected subprojects compileSdk 35 override.')
              print('--- android/build.gradle ---')
              print(content)

          # build.gradle.kts (Kotlin)
          subprojects_kts_snippet = (
              '\n// AUTO: Force all plugins to compileSdk 35\n'
              'subprojects {\n'
              '    val proj = this\n'
              '    val configureProject = {\n'
              '        val android = proj.extensions.findByName("android")\n'
              '        if (android != null) {\n'
              '            try {\n'
              '                val method = android::class.java.getMethod("compileSdkVersion", Int::class.javaPrimitiveType)\n'
              '                method.invoke(android, 35)\n'
              '                println("Set compileSdkVersion to 35 for project: ${proj.name}")\n'
              '            } catch (e: Exception) {\n'
              '                try {\n'
              '                    val method = android::class.java.getMethod("setCompileSdk", java.lang.Integer::class.java)\n'
              '                    method.invoke(android, 35)\n'
              '                    println("Set compileSdk to 35 for project: ${proj.name}")\n'
              '                } catch (e2: Exception) {\n'
              '                    println("Failed to set compileSdk for project: ${proj.name}: ${e2.message}")\n'
              '                }\n'
              '            }\n'
              '        }\n'
              '    }\n'
              '    if (proj.state.executed) {\n'
              '        configureProject()\n'
              '    } else {\n'
              '        proj.afterEvaluate {\n'
              '            configureProject()\n'
              '        }\n'
              '    }\n'
              '}\n'
          )
          root_gradle_kts = 'android/build.gradle.kts'
          if os.path.exists(root_gradle_kts):
              with open(root_gradle_kts, 'r') as f:
                  content = f.read()
              if 'compileSdkVersion' not in content and 'compileSdk' not in content:
                  content += subprojects_kts_snippet
                  with open(root_gradle_kts, 'w') as f:
                      f.write(content)
                  print('Injected subprojects compileSdk 35 override to build.gradle.kts.')
              print('--- android/build.gradle.kts ---')
              print(content)

          # ── Also patch app/build.gradle directly ──────────────────────
          app_gradle = 'android/app/build.gradle'
          if os.path.exists(app_gradle):
              with open(app_gradle, 'r') as f:
                  content = f.read()
              content = re.sub(r'compileSdkVersion\s*=?\s*(flutter\.compileSdkVersion|\d+)', 'compileSdkVersion 35', content)
              content = re.sub(r'compileSdk\s*=?\s*(flutter\.compileSdkVersion|\d+)', 'compileSdk 35', content)
              content = re.sub(r'targetSdkVersion\s*=?\s*(flutter\.targetSdkVersion|\d+)', 'targetSdkVersion 35', content)
              content = re.sub(r'targetSdk\s*=?\s*(flutter\.targetSdkVersion|\d+)', 'targetSdk 35', content)
              content = re.sub(r'minSdkVersion\s*=?\s*(flutter\.minSdkVersion|\d+)', 'minSdkVersion 24', content)
              content = re.sub(r'minSdk\s*=?\s*(flutter\.minSdkVersion|\d+)', 'minSdk 24', content)
              with open(app_gradle, 'w') as f:
                  f.write(content)
              print('Patched app/build.gradle compileSdk/targetSdk to 35 and minSdk to 24.')
              print('--- android/app/build.gradle ---')
              print(content)

          # app/build.gradle.kts (Kotlin)
          app_gradle_kts = 'android/app/build.gradle.kts'
          if os.path.exists(app_gradle_kts):
              with open(app_gradle_kts, 'r') as f:
                  content = f.read()
              content = re.sub(r'compileSdk\s*=\s*(flutter\.compileSdkVersion|\d+)', 'compileSdk = 35', content)
              content = re.sub(r'targetSdk\s*=\s*(flutter\.targetSdkVersion|\d+)', 'targetSdk = 35', content)
              content = re.sub(r'minSdk\s*=\s*(flutter\.minSdkVersion|\d+)', 'minSdk = 24', content)
              with open(app_gradle_kts, 'w') as f:
                  f.write(content)
              print('Patched app/build.gradle.kts compileSdk/targetSdk to 35 and minSdk to 24.')
              print('--- android/app/build.gradle.kts ---')
              print(content)

          # ── Patch local.properties ────────────────────────────────────
          local_properties = 'android/local.properties'
          if os.path.exists(local_properties):
              with open(local_properties, 'a') as f:
                  f.write('\nflutter.compileSdkVersion=35\n')
                  f.write('flutter.targetSdkVersion=35\n')
                  f.write('flutter.minSdkVersion=24\n')
              print('Appended SDK versions to local.properties.')
          PYEOF

      - name: Configure Android native platform (Internet & Firebase)
        run: python3 /tmp/configure_android.py

      - name: Fix jcenter in plugins
        run: |
          find ~/.pub-cache/hosted -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
