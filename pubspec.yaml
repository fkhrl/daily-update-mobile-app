name: daily_update_app
description: "A beautiful Flutter application for managing tasks and receiving email updates."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  firebase_core: any
  firebase_messaging: any
  flutter_local_notifications: ^17.1.2
  table_calendar: ^3.1.1
  google_fonts: ^6.2.0
  url_launcher: ^6.3.2
  speech_to_text: ^7.4.0
  toastification: ^3.2.0
  flutter_ringtone_player: ^4.0.0+4
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  google_sign_in: ^6.2.1
  local_auth: ^3.0.1
  device_info_plus: ^12.4.0
  fl_chart: ^1.2.0


  shake: any
  flutter_markdown: ^0.7.7+1
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  file_picker: ^8.1.4
  audioplayers: ^6.7.1
  percent_indicator: ^4.2.5
  flutter_tts: ^4.2.5
  android_alarm_manager_plus: ^5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/google_logo.png


