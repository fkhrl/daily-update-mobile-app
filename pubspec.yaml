name: daily_update_app
description: "A beautiful Flutter application for managing tasks and receiving email updates."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  firebase_core: any
  firebase_messaging: any
  flutter_local_notifications: ^17.1.2
  table_calendar: ^3.1.1
  google_fonts: ^6.2.0
  shake: ^2.2.0
  url_launcher: ^6.3.2
  speech_to_text: ^7.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png

dependency_overrides:
  sensors_plus: ^4.0.2
